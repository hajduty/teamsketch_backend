services:
  redis:
    image: 'redis:alpine'
    container_name: redis
    ports:
      - '6379:6379'

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "Tpq3ak0T6HRSAX1ZlNDPSQOVfd9SMjVxxsVpyP4eElUQkoxMGWX5RJ9kiBCRAglq"
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data_new:/var/lib/mysql
    ports:
      - "3307:3306"

  authservice:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    container_name: authservice
    environment:
      UserServiceURL: "http://userservice:8080"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=TS;User ID=root;Password=Tpq3ak0T6HRSAX1ZlNDPSQOVfd9SMjVxxsVpyP4eElUQkoxMGWX5RJ9kiBCRAglq"
      AllowedOrigin: "http://localhost:5173"
    ports:
      - "7154:8080"
    depends_on:
      - userservice
      - mysql
      - sqlinit

  permissionservice:
    build:
      context: .
      dockerfile: PermissionService/Dockerfile
    container_name: permissionservice
    environment:
      AuthServiceURL: "http://authservice:8080"
      UserServiceURL: "http://userservice:8080"
      ConnectionStrings__RedisConnectionString: "redis:6379,abortConnect=false"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=TS;User ID=root;Password=Tpq3ak0T6HRSAX1ZlNDPSQOVfd9SMjVxxsVpyP4eElUQkoxMGWX5RJ9kiBCRAglq"
      ASPNETCORE_URLS: "http://0.0.0.0:7122"
      AllowedOrigin: "http://localhost:5173"
    ports:
      - "7122:7122"
      - "7100:7100"
    depends_on:
      - authservice
      - userservice
      - mysql
      - sqlinit

  # Stateless WebSocket server: room updates flow through Redis streams, so this can be scaled out.
  roomservice:
    build:
      context: .
      dockerfile: RoomService/Dockerfile
    container_name: roomservice
    command: node ./bin/server.js --no-colors
    environment:
      PORT: 3002
      PROTO_PATH: "Shared/Contracts/Protos/permission_service.proto"
      PERMISSION_SERVICE_URL: "permissionservice:7122"
      REDIS: "redis://redis:6379"
      REDIS_URL: "redis:6379"
      MYSQL: "mysql://root:Tpq3ak0T6HRSAX1ZlNDPSQOVfd9SMjVxxsVpyP4eElUQkoxMGWX5RJ9kiBCRAglq@mysql:3306/TS"
    ports:
      - "3002:3002"
    depends_on:
      permissionservice:
        condition: service_started
      redis:
        condition: service_started
      sqlinit:
        condition: service_completed_successfully

  # Persists Redis room streams to MySQL and trims them.
  worker:
    build:
      context: .
      dockerfile: RoomService/Dockerfile
    container_name: roomservice-worker
    command: node ./bin/worker.js --no-colors
    environment:
      REDIS: "redis://redis:6379"
      MYSQL: "mysql://root:Tpq3ak0T6HRSAX1ZlNDPSQOVfd9SMjVxxsVpyP4eElUQkoxMGWX5RJ9kiBCRAglq@mysql:3306/TS"
    depends_on:
      redis:
        condition: service_started
      sqlinit:
        condition: service_completed_successfully

  userservice:
    build:
      context: .
      dockerfile: UserService/Dockerfile
    container_name: userservice
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=TS;User ID=root;Password=Tpq3ak0T6HRSAX1ZlNDPSQOVfd9SMjVxxsVpyP4eElUQkoxMGWX5RJ9kiBCRAglq"
    ports:
      - "8082:8080"
    depends_on:
      - mysql
      - sqlinit

  sqlinit:
    image: mysql:8.1
    depends_on:
      - mysql
    environment:
      MYSQL_ROOT_PASSWORD: "Tpq3ak0T6HRSAX1ZlNDPSQOVfd9SMjVxxsVpyP4eElUQkoxMGWX5RJ9kiBCRAglq"
    volumes:
      - ./sql-scripts:/scripts:ro
      - ./sql-init.sh:/sql-init.sh:ro
    entrypoint: ["/bin/bash", "/sql-init.sh"]

volumes:
  mysql_data_new:
