version: '3.9'

services:
  redis:
    image: 'redis:alpine'
    container_name: redis
    ports:
      - '6379:6379'

  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    command: server /data --console-address :9001

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "Tpq3ak0T6HRSAX1ZlNDPSQOVfd9SMjVxxsVpyP4eElUQkoxMGWX5RJ9kiBCRAglq"
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data_new:/var/lib/mysql
    ports:
      - "3307:3306"

  authservice:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    container_name: authservice
    environment:
      UserServiceURL: "http://userservice:8080"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=TS;User ID=root;Password=Tpq3ak0T6HRSAX1ZlNDPSQOVfd9SMjVxxsVpyP4eElUQkoxMGWX5RJ9kiBCRAglq"
      AllowedOrigin: "http://localhost:5173"
    ports:
      - "7154:8080"
    depends_on:
      - userservice
      - mysql
      - sqlinit

  permissionservice:
    build:
      context: .
      dockerfile: PermissionService/Dockerfile
    container_name: permissionservice
    environment:
      AuthServiceURL: "http://authservice:8080"
      UserServiceURL: "http://userservice:8080"
      ConnectionStrings__RedisConnectionString: "redis:6379,abortConnect=false"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=TS;User ID=root;Password=Tpq3ak0T6HRSAX1ZlNDPSQOVfd9SMjVxxsVpyP4eElUQkoxMGWX5RJ9kiBCRAglq"
      ASPNETCORE_URLS: "http://0.0.0.0:7122"
      AllowedOrigin: "http://localhost:5173"
    ports:
      - "7122:7122"
      - "7100:7100"
    depends_on:
      - authservice
      - userservice
      - mysql
      - sqlinit

  roomservice:
    build:
      context: .
      dockerfile: RoomService/Dockerfile
    container_name: roomservice
    command: node ./bin/server.js --no-colors
    environment:
      PROTO_PATH: "Shared/Contracts/Protos/permission_service.proto"
      REDIS_URL: "redis:6379"
      PERMISSION_SERVICE_URL: "permissionservice:7122"
      PORT: 3002
      S3_ENDPOINT: "minio"
      S3_PORT: "9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET: "yjs"
      S3_USE_SSL: "false"
      REDIS: "redis://redis:6379"
      AUTH_PERM_CALLBACK: "http://dummy"
      AUTH_PUBLIC_KEY: "dummy"
      AllowedOrigin: "http://localhost:5173"
    ports:
      - "3002:3002"
    depends_on:
      - permissionservice
      - redis
      - minio
      - sqlinit

  worker:
    build:
      context: .
      dockerfile: RoomService/Dockerfile
    container_name: roomservice-worker
    command: node ./bin/worker.js --no-colors
    environment:
      PROTO_PATH: "Shared/Contracts/Protos/permission_service.proto"
      REDIS_URL: "redis:6379"
      PERMISSION_SERVICE_URL: "permissionservice:7122"
      PORT: 8080
      S3_ENDPOINT: "minio"
      S3_PORT: "9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET: "yjs"
      S3_USE_SSL: "false"
      REDIS: "redis://redis:6379"
      AUTH_PERM_CALLBACK: "http://dummy"
      AUTH_PUBLIC_KEY: "dummy"
      AllowedOrigin: "http://localhost:5173"
    depends_on:
      - minio
      - redis
      - sqlinit

  userservice:
    build:
      context: .
      dockerfile: UserService/Dockerfile
    container_name: userservice
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=TS;User ID=root;Password=Tpq3ak0T6HRSAX1ZlNDPSQOVfd9SMjVxxsVpyP4eElUQkoxMGWX5RJ9kiBCRAglq"
    ports:
      - "8082:8080"
    depends_on:
      - mysql
      - sqlinit

 # sqlinit:
 #   image: mysql:8
 #   depends_on:
 #     - mysql
 #   volumes:
 #     - ./sql-scripts:/scripts
 #     - ./sql-init.sh:/sql-init.sh
 #   environment:
 #     MYSQL_ROOT_PASSWORD: "Tpq3ak0T6HRSAX1ZlNDPSQOVfd9SMjVxxsVpyP4eElUQkoxMGWX5RJ9kiBCRAglq"
 #   command: ["bash", "-c", "chmod +x /sql-init.sh && /sql-init.sh"]

  sqlinit:
    image: mysql:8.1
    depends_on:
      - mysql
    environment:
      MYSQL_ROOT_PASSWORD: "Tpq3ak0T6HRSAX1ZlNDPSQOVfd9SMjVxxsVpyP4eElUQkoxMGWX5RJ9kiBCRAglq"
    volumes:
      - ./sql-scripts:/scripts:ro
      - ./sql-init.sh:/sql-init.sh:ro
    entrypoint: ["/bin/bash", "/sql-init.sh"]

volumes:
  mysql_data:
  mysql_data_new:
  minio_data:
